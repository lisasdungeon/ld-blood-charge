<div class="bc-pc-widget-container">
  <style>
    .bc-pc-widget-container {
      background: linear-gradient(135deg, rgba(10, 0, 0, 0.98), rgba(25, 0, 0, 0.95));
      padding: 16px;
      border-radius: 12px;
      font-family: 'Cinzel', serif;
    }

    .bc-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(150, 0, 0, 0.5);
    }

    .bc-header-img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 2px solid #960000;
      object-fit: cover;
    }

    .bc-header-info h2 {
      margin: 0;
      font-size: 1.1em;
      color: #ff6666;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
    }

    .bc-header-info .bc-subtitle {
      font-size: 0.75em;
      color: #cc9999;
      margin-top: 2px;
    }

    .bc-charge-display {
      text-align: center;
      margin-bottom: 16px;
    }

    .bc-charge-value {
      font-size: 2.5em;
      font-weight: bold;
      color: #ff4444;
      text-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
    }

    .bc-charge-value .bc-max {
      font-size: 0.6em;
      color: #aa6666;
    }

    .bc-pips-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 12px 0;
    }

    .bc-pip {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #660000;
      background: rgba(40, 0, 0, 0.8);
      transition: all 0.2s ease;
    }

    .bc-pip.filled {
      background: linear-gradient(135deg, #cc0000, #ff3333);
      border-color: #ff6666;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
    }

    .bc-progress-bar {
      height: 8px;
      background: rgba(40, 0, 0, 0.8);
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
    }

    .bc-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #880000, #cc0000, #ff3333);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .bc-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .bc-action-btn {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #660000;
      border-radius: 6px;
      background: rgba(40, 0, 0, 0.9);
      color: #ff8888;
      font-family: 'Cinzel', serif;
      font-size: 0.85em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .bc-action-btn:hover {
      background: rgba(80, 0, 0, 0.9);
      border-color: #cc0000;
      color: #ffcccc;
      box-shadow: 0 0 10px rgba(200, 0, 0, 0.4);
    }

    .bc-bargain-btn {
      border-color: #006600;
      color: #88ff88;
    }

    .bc-bargain-btn:hover {
      background: rgba(0, 60, 0, 0.9);
      border-color: #00cc00;
      color: #ccffcc;
      box-shadow: 0 0 10px rgba(0, 200, 0, 0.4);
    }

    .bc-surge-btn {
      border-color: #990000;
    }

    .bc-close-btn {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      background: rgba(30, 30, 30, 0.9);
      border: 1px solid #444;
      border-radius: 4px;
      color: #999;
      font-size: 0.8em;
      cursor: pointer;
    }

    .bc-close-btn:hover {
      background: rgba(50, 50, 50, 0.9);
      color: #ccc;
    }

    .bc-info-text {
      font-size: 0.7em;
      color: #886666;
      text-align: center;
      margin-top: 8px;
    }
  </style>

  {{#if error}}
    <div class="bc-error">
      <p>{{message}}</p>
    </div>
  {{else}}
    <div class="bc-header">
      <img class="bc-header-img" src="{{actorImg}}" alt="{{actorName}}">
      <div class="bc-header-info">
        <h2>{{actorName}}</h2>
        <div class="bc-subtitle">{{localize 'LD.BloodCharge.PlayerWidget.StatusSubtitle'}}</div>
      </div>
    </div>

    <div class="bc-charge-display">
      <div class="bc-charge-value">
        {{currentCharge}}<span class="bc-max"> / {{maxCharge}}</span>
      </div>
      <div class="bc-pips-row">
        {{#each chargePips}}
          <div class="bc-pip {{#if this.filled}}filled{{/if}}" title="Charge {{this.index}}"></div>
        {{/each}}
      </div>
      <div class="bc-progress-bar">
        <div class="bc-progress-fill" style="width: {{chargePercentage}}%;"></div>
      </div>
    </div>

    <div class="bc-actions">
      <button type="button" class="bc-action-btn bc-bargain-btn" title="{{localize 'LD.BloodCharge.PlayerWidget.RequestTitle'}}">
        <i class="fas fa-handshake"></i> {{localize 'LD.BloodCharge.PlayerWidget.BtnBargain'}}
      </button>
      <button type="button" class="bc-action-btn bc-surge-btn" title="{{localize 'LD.BloodCharge.PlayerWidget.SurgeTitle'}}">
        <i class="fas fa-bolt"></i> {{localize 'LD.BloodCharge.PlayerWidget.BtnSurge'}}
      </button>
    </div>

    {{#if canRequest}}
      <p class="bc-info-text">{{localize 'LD.BloodCharge.PlayerWidget.BargainInfo'}}</p>
    {{/if}}

    <button type="button" class="bc-close-btn" title="{{localize 'LD.BloodCharge.PlayerWidget.CloseTitle'}}">
      <i class="fas fa-times"></i> {{localize 'LD.BloodCharge.GMHub.BtnClose'}}
    </button>
  {{/if}}
</div>
